spring:
  application:
    name: laboratorio-pagos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pagos_lab}
    username: ${DB_USERNAME:pagos_lab}
    password: ${DB_PASSWORD:pagos_lab_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
