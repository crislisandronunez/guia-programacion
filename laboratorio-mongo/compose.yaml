name: laboratorio-mongo
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo_data:/data/db
      - ./docker/init-replica.js:/scripts/init-replica.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo_data:
