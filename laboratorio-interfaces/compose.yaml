name: laboratorio-interfaces
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: contratos_lab
      POSTGRES_USER: contratos_lab
      POSTGRES_PASSWORD: contratos_lab_local
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - contratos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contratos_lab -d contratos_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  contratos_data:

