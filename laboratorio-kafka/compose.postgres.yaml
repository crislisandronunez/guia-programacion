services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kafka_lab
      POSTGRES_USER: kafka_lab
      POSTGRES_PASSWORD: kafka_lab_local
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka_lab -d kafka_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
