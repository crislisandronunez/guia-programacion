name: laboratorio-data-jpa
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jpa_lab
      POSTGRES_USER: jpa_lab
      POSTGRES_PASSWORD: jpa_lab_local
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - jpa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpa_lab -d jpa_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jpa_data:
